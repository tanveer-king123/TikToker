<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TikToker - No.1 App</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:12px 12px;background:linear-gradient(to bottom,rgba(0,0,0,0.9),transparent)}
.top .center{display:flex;gap:16px;font-weight:700;font-size:16px;color:#888}
.top .center b{color:#fff;border-bottom:2px solid #fff;padding-bottom:3px}
.feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.post{position:relative;height:100vh;width:100vw;scroll-snap-align:start;background:#000}
.post video,.post img.main{width:100%;height:100%;object-fit:cover}
.rbar{position:absolute;right:8px;bottom:100px;display:flex;flex-direction:column;gap:18px;align-items:center;z-index:10}
.ppic{width:50px;height:50px;border-radius:50%;border:2px solid #fff;object-fit:cover}
.plus{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);background:#fe2c55;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.ibtn{width:48px;height:48px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;backdrop-filter:blur(10px)}
.ibtn.liked{background:rgba(254,44,85,0.4);color:#fe2c55}
.rbar span{font-size:12px;font-weight:700}
.binfo{position:absolute;left:10px;bottom:22px;right:75px;z-index:10}
.binfo h4{font-size:15px}
.binfo p{font-size:13px;margin-top:4px;line-height:1.3;color:#eee}
.music{margin-top:6px;font-size:12px;display:flex;gap:5px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:6px 0 8px;z-index:101}
.bottom-nav div{text-align:center;font-size:10px;color:#777}
.bottom-nav .active{color:#fff}
.bottom-nav b{display:block;font-size:22px}
#searchPage,#profilePage{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:500;display:none;overflow-y:auto;padding:60px 15px 20px}
#searchPage.show,#profilePage.show{display:block}
.searchBox{width:100%;background:#222;border:none;padding:12px 15px;border-radius:8px;color:#fff;font-size:15px}
#comments{position:fixed;bottom:-100%;left:0;right:0;height:65vh;background:#121212;border-radius:18px 18px 0 0;z-index:600;transition:0.35s;padding:15px;overflow-y:auto}
#comments.show{bottom:0}
.ad{position:absolute;top:60px;left:10px;background:rgba(255,255,255,0.2);padding:4px 8px;border-radius:5px;font-size:11px;z-index:10}
</style>
</head>
