
!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikToker</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:system-ui;overflow:hidden}.top{position:fixed;top:0;left:0;right:0;z-index:99;display:flex;justify-content:center;gap:16px;padding:12px;background:linear-gradient(#000,transparent);color:#888;font-weight:700}.top .a{color:#fff;border-bottom:2px solid #fff}.feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}.post{height:100vh;width:100vw;scroll-snap-align:start;position:relative;background:#111}.post .bg{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.r{position:absolute;right:10px;bottom:110px;z-index:5;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}.pp{width:48px;height:48px;border-radius:50%;border:2px solid #fff}.ic{width:48px;height:48px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}.c{font-size:12px;font-weight:700}.i{position:absolute;left:12px;bottom:90px;right:80px;z-index:5}.btm{position:fixed;bottom:0;left:0;right:0;background:#000;display:flex;justify-content:space-around;padding:10px 0 14px;border-top:1px solid #222;z-index:100;color:#777;font-size:10px;text-align:center}.btm .a{color:#fff}.plus{width:36px;height:26px;background:#fff;color:#000;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;box-shadow:-3px 0 #25F4EE,3px 0 #fe2c55}.page{position:fixed;inset:0;background:#000;z-index:110;display:none;overflow-y:auto}.page.show{display:block}.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:#1e1e1e;width:100%;max-width:360px;border-radius:16px;padding:20px}.box input{width:100%;background:#2a2a2a;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;margin-top:10px}.box button{width:100%;background:#fe2c55;border:none;color:#fff;padding:12px;border-radius:10px;font-weight:900;margin-top:12px}</style></head><body>
<div class="top"><span class="a">For You</span><span>Following</span><span>Friends</span></div>
<div class="feed" id="feed"></div>
<div class="btm"><div class="a">⌂<br>Home</div><div>👥<br>Friends</div><div onclick="openUp()"><div class="plus">+</div></div><div>✉<br>Inbox</div><div onclick="openPro()">👤<br>Profile</div></div>
<div class="page" id="proPage"><div style="padding:12px;display:flex;justify-content:space-between"><span onclick="closePro()">‹ Back</span><b>@tanveers840</b><span>...</span></div><div style="text-align:center;padding:20px"><img src="https://i.pravatar.cc/150?u=tanveer" style="width:90px;height:90px;border-radius:50%;border:2px solid #fff"><h3 style="margin-top:10px">Tanveer King 👑</h3><div style="display:flex;justify-content:center;gap:24px;margin-top:12px"><div><b>28</b><br><small>Following</small></div><div><b>927</b><br><small>Followers</small></div><div><b>4140</b><br><small>Likes</small></div></div><p style="margin-top:12px;color:#aaa;font-size:13px">My Own TikTok App LIVE! 🇵🇰 UK to PK</p></div></div>
<div class="modal" id="first"><div class="box"><h3>اپنا اکاؤنٹ بناؤ</h3><input id="n" placeholder="نام - Tanveer King"><input id="u" placeholder="یوزر - @tanveer"><button onclick="makeAcc()">شروع کرو 🚀</button></div></div>
<div class="modal" id="up"><div class="box"><h3>ویڈیو اپلوڈ</h3><input type="file" id="f" accept="video/*,image/*"><input id="cap" placeholder="کیپشن #fyp"><button onclick="doUp()">اپلوڈ کرو</button><button style="background:#333" onclick="closeM()">بند</button></div></div>
<script>
let me=JSON.parse(localStorage.getItem('tk_me')||'null');
let posts=[{user:"🌸 Innocent Girl",cap:"REPOST #200k likes #1m views",music:"Halaen Lae Dill",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=720",likes:"21.2K",cc:931},{user:"🇦🇫 Sudais 704",cap:"@AYAZ YARBASH",music:"Original",img:"https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=720",likes:"48",cc:28},{user:"Tanveer 🔥 @tanveers840",cap:"My own App LIVE! 🇵🇰",music:"Original - Tanveer",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",likes:"4140",cc:149}];
let feed=document.getElementById('feed');
function render(){feed.innerHTML='';posts.forEach((p,i)=>{let d=document.createElement('div');d.className='post';let m=p.video?`<video class="bg" loop muted playsinline src="${p.video}"></video>`:`<img class="bg" src="${p.img}">`;d.innerHTML=`${m}<div class="r"><img class="pp" src="https://i.pravatar.cc/100?u=${i}"><div><div class="ic">🤍</div><div class="c">${p.likes}</div></div><div><div class="ic">💬</div><div class="c">${p.cc}</div></div><div><div class="ic">↗️</div></div><div><div class="ic">🔖</div></div></div><div class="i"><b>${p.user}</b><br><small>${p.cap}</small><br><small>♫ ${p.music}</small></div>`;feed.appendChild(d)});let vids=document.querySelectorAll('video.bg');let ob=new IntersectionObserver(e=>{e.forEach(en=>{let v=en.target;if(en.isIntersecting)v.play().catch(()=>{});else v.pause()})},{threshold:0.6});vids.forEach(v=>ob.observe(v))}
function openPro(){document.getElementById('proPage').classList.add('show')}function closePro(){document.getElementById('proPage').classList.remove('show')}function openUp(){if(!me){document.getElementById('first').classList.add('show');return}document.getElementById('up').classList.add('show')}function closeM(){document.querySelectorAll('.modal').forEach(x=>x.classList.remove('show'))}function makeAcc(){let nn=document.getElementById('n').value||'Tanveer King';let uu=document.getElementById('u').value||'@tanveers840';me={name:nn,user:uu};localStorage.setItem('tk_me',JSON.stringify(me));closeM();alert('اکاؤنٹ بن گیا! اب + سے ویڈیو ڈالو')}function doUp(){let file=document.getElementById('f').files[0];let c=document.getElementById('cap').value||'My video #fyp';if(!file){alert('پہلے فائل منتخب کرو');return}let url=URL.createObjectURL(file);let isV=file.type.startsWith('video');posts.unshift({user:me.name,cap:c,music:'Original',video:isV?url:null,img:!isV?url:null,likes:'0',cc:0});closeM();render()}
if(!me)setTimeout(()=>{document.getElementById('first').classList.add('show')},700);
render();
</script></body></html>
