
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikToker - Tanveer King 👑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;text-align:center}
h1{margin-top:40px}
video{width:92%;max-width:400px;border-radius:16px;margin-top:20px;background:#111}
.btn{background:#fe2c55;color:#fff;border:none;padding:14px 28px;border-radius:12px;font-weight:900;margin-top:18px;font-size:16px}
.feed{margin-top:20px}
</style>
</head>
<body>
<h1>✅ TikToker LIVE ہو گیا! 👑</h1>
<p>Tanveer King کی App چل گئی</p>

<div class="feed">
<video controls autoplay muted loop playsinline src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>
<br>
<button class="btn" onclick="document.getElementById('acc').style.display='block'">اکاؤنٹ بناؤ</button>

<div id="acc" style="display:none;background:#1e1e1e;margin:20px;padding:20px;border-radius:16px">
<input id="n" placeholder="نام - Tanveer King" style="width:90%;padding:12px;border-radius:8px;border:1px solid #333;background:#2a2a2a;color:#fff"><br><br>
<input id="u" placeholder="@tanveers840" style="width:90%;padding:12px;border-radius:8px;border:1px solid #333;background:#2a2a2a;color:#fff"><br><br>
<button class="btn" onclick="alert('مبارک ہو! اکاؤنٹ بن گیا: '+document.getElementById('n').value)">شروع کرو 🚀</button>
</div>

<br><br>
<p>👇 نیچے سوائپ کرو، ہزاروں ویڈیو</p>
<video controls muted loop style="width:92%;margin-top:12px;border-radius:16px" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"></video>
<video controls muted loop style="width:92%;margin-top:12px;border-radius:16px" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"></video>
</div>

<script>
// infinite feel
window.addEventListener('scroll',()=>{
if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 500){
let v=document.createElement('video');
v.controls=true;v.muted=true;v.loop=true;
v.style.width='92%';v.style.marginTop='12px';v.style.borderRadius='16px';
v.src='https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4';
document.querySelector('.feed').appendChild(v);
}
});
</script>
</body>
</html>
