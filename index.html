 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TikToker - No.1 App</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;padding:12px 14px;background:linear-gradient(to bottom,rgba(0,0,0,0.9),transparent)}
.logo{font-weight:900;font-size:22px} .logo span{color:#fe2c55}
.nav{display:flex;gap:14px;color:#888;font-weight:700} .nav b{color:#fff;border-bottom:2px solid #fff}
.feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory} .feed::-webkit-scrollbar{display:none}
.post{height:100vh;width:100vw;scroll-snap-align:start;position:relative;background:#000}
.post img,.post video{width:100%;height:100%;object-fit:cover}
.right{position:absolute;right:10px;bottom:100px;display:flex;flex-direction:column;gap:18px;align-items:center}
.pp{width:50px;height:50px;border-radius:50%;border:2px solid #fff;object-fit:cover}
.btn{width:48px;height:48px;background:rgba(255,255,255,0.18);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.right span{font-size:12px;font-weight:700}
.bottom{position:absolute;left:12px;bottom:25px;right:80px}
.bottom h3{font-size:15px} .bottom p{font-size:13px;color:#eee;margin-top:4px}
.btm{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0;z-index:200}
.btm div{font-size:10px;color:#888;text-align:center} .btm .on{color:#fff} .btm b{display:block;font-size:22px}
.ad{position:absolute;top:60px;left:10px;background:#FFC107;color:#000;padding:4px 8px;border-radius:4px;font-size:11px;font-weight:800}
</style>
</head>
<body>
